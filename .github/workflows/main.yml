name: Quant Strategy CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v5

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 调试：确认当前目录结构和 requirements.txt 内容（关键排查步骤）
      - name: Debug: Show current dir and files
        run: |
          pwd
          ls -la
          ls -la .github/workflows/
          cat requirements.txt

      # 4. 安装依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. 调试：确认 yfinance 是否安装成功
      - name: Debug: List installed packages
        run: pip list | grep yfinance

      # 6. 运行策略脚本
      - name: Run Strategy
        run: python my_strategy.py --notify

      # 7. 上传 Excel 报告
      - name: Upload Excel Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: CloudSync-Report-${{ github.run_number }}
          path: reports/Strategy_Report.xlsx