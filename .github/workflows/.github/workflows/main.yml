name: Quant Strategy CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 使用稳定的 Ubuntu 22.04
    runs-on: ubuntu-22.04
    
    steps:
    # 1. 检出代码 (更新到 v5)
    - uses: actions/checkout@v5

    # 2. 设置 Python 环境 (更新到 v5)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装依赖
    - name: Install Dependencies
      run: |
        pip install backtrader akshare pandas numpy quantstats openpyxl matplotlib --prefer-offline

    # 4. 运行策略
    - name: Run Strategy
      run: python my_strategy.py

    # 5. 上传报告 (更新到 v5)
    - name: Upload Excel Report
      uses: actions/upload-artifact@v5
      with:
        name: CloudSync-Report-${{ github.run_number }}
        path: |
          reports/Strategy_Report.xlsx
          logs/