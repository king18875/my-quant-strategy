name: Quant Strategy CI

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - uses: actions/checkout@v3

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    # 3. 安装依赖
    - name: Install Dependencies
      run: |
        pip install backtrader akshare pandas numpy quantstats openpyxl matplotlib

    # 4. 运行策略
    - name: Run Strategy
      run: python my_strategy.py

    # 5. 上传 Excel 报告 (关键步骤)
    - name: Upload Excel Report
      uses: actions/upload-artifact@v4
      with:
        # 这里使用了 CloudSync 文件夹名，并加上了时间戳防止重复
        name: CloudSync-Report-${{ github.run_number }}
        path: reports/Strategy_Report.xlsx