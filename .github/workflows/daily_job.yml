name: 每日量化交易任务

on:
  # 1. 定时触发 (Cron 表达式)
  # 注意：GitHub 使用 UTC 时间。北京时间 = UTC + 8小时。
  # 9:30 (北京时间) = 1:30 (UTC)
  # 15:30 (北京时间) = 7:30 (UTC)
  schedule:
    - cron: '30 1 * * *'  # 北京时间 09:30 运行
    - cron: '30 7 * * *'  # 北京时间 15:30 运行
  
  # 2. 允许手动触发 (方便你测试)
  workflow_dispatch:

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤 1: 下载代码
      - name: 检出代码
        uses: actions/checkout@v3

      # 步骤 2: 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      # 步骤 3: 安装依赖
      - name: 安装依赖库
        run: |
          pip install akshare backtrader pandas

      # 步骤 4: 运行你的策略
      - name: 运行策略脚本
        run: python my_strategy.py
        env:
          # 将 Secrets 中的变量注入到环境中
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}